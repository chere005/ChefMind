# ChefMind Desktop for Windows — manual only. Tauri cannot cross-compile from
# the Mac, so this job builds the .msi/.exe on a windows runner from the
# same web export the site serves. Trigger it from the Actions tab (or a dtp
# dispatches it after the push) when a Windows build is actually wanted; it
# never runs on push. Carried from CalMind's workflow of the same name.
name: desktop-windows
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: npm ci
      # export:web PLUS the head patch — ChefMind's export script is bare, the
      # patch is a separate step here exactly as deploy.sh runs it, and the
      # Windows bundle should carry the same index.html the site serves.
      # TWO STEPS, not one `run:` block with two lines. The default shell on a
      # windows runner is pwsh, which only fails the step on the LAST command's
      # exit code — so a broken export would be masked by a head patch that
      # then "succeeded" against a stale or absent dist.
      - name: Export the web app
        run: npm run export:web
      - name: Patch the exported head
        run: node tools/patch-web-html.mjs app/dist/index.html
      - name: Build the Windows bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
      # The runner IS a Windows machine with a desktop session, so the smoke
      # that used to wait for a human runs here: install the MSI the way a
      # user's machine would, launch what it installed, and hold it to the
      # mac smoke's own bar — it launches, it survives eight seconds, it puts
      # up a real window. A window showing an error page still passes — the
      # same honest limitation CalMind's smoke states.
      - name: Smoke the MSI on the runner
        shell: pwsh
        run: |
          $msi = Get-ChildItem desktop/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw 'no MSI to smoke' }
          Write-Host "installing $($msi.Name)"
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec failed with exit $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:ProgramFiles","${env:ProgramFiles(x86)}","$env:LOCALAPPDATA\Programs" -Recurse -Include ChefMind.exe,chefmind-desktop.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'the MSI reported success but installed no ChefMind binary' }
          Write-Host "launching $($exe.FullName)"
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "the installed app exited within 8 seconds (code $($app.ExitCode))" }
          # The window takes a beat to be titled; three looks over six seconds.
          $title = ''
          foreach ($i in 1..3) {
            $title = (Get-Process -Id $app.Id -ErrorAction SilentlyContinue).MainWindowTitle
            if ($title -like '*ChefMind*') { break }
            Start-Sleep -Seconds 2
          }
          if ($title -notlike '*ChefMind*') { throw "the app is running but shows no ChefMind window - got '$title'" }
          Write-Host "window up: '$title' - stopping it"
          Stop-Process -Id $app.Id
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChefMind-windows
          # error, not the default warn: CalMind's first "success" here
          # uploaded NOTHING, and a green run with no artifact is the kind of
          # check that cannot fail.
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
